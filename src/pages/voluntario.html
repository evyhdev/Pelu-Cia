<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voluntariado - Pelu&Cia</title>
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/header.css">
    <link rel="stylesheet" href="/src/css/voluntario.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <a href="/"><img src="/images/logos/logo.png" alt="Logo"></a>
        </div>

        <input type="checkbox" id="menu-control" class="menu-checkbox">

        <label for="menu-control" class="hamburger">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </label>

        <nav class="nav">
            <ul class="menu">
                <li><a href="/src/pages/adotar.html"><img src="/icons/adotar.png" alt="">Adotar</a></li>
                <li><a href="/src/pages/ajudar.html"><img src="/icons/ajudar.png" alt="">Ajudar</a></li>
                <li><a href="/src/pages/noticias.html"><img src="/icons/noticias.png" alt="">Notícias</a></li>
                <li><a href="/src/pages/sobre.html"><img src="/icons/sobre.png" alt="">Sobre</a></li>
                <li><a href="/src/pages/voluntario.html"><img src="/icons/voluntariado.png" alt="">Voluntariado</a></li>
            </ul>
            <div class="actions">
                <a href="#" class="login-btn">Login</a>
            </div>
        </nav>
    </header>

    <main class="voluntariado-page">
        <section class="hero">
            <div class="container">
                <h1>Seja um Voluntário</h1>
                <p>Junte-se à nossa equipe e ajude a transformar vidas! Seu tempo e dedicação fazem toda a diferença.</p>
            </div>
        </section>

        <section class="inscricao" id="inscricao">
            <div class="container">
                <h2>Formulário de Inscrição</h2>
                <p>Preencha os dados abaixo para se candidatar como voluntário</p>
                
                <form id="formVoluntario" action="#" method="POST">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <button type="submit" class="btn-submit">Enviar Inscrição</button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
