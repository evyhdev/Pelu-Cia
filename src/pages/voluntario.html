<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voluntariado - Pelu&Cia</title>
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/header.css">
    <link rel="stylesheet" href="/src/css/voluntario.css">
</head>

<body>
    <header class="header">
        <div class="logo">
            <a href="/"><img src="/images/logos/logo.png" alt="Logo"></a>
        </div>

        <input type="checkbox" id="menu-control" class="menu-checkbox">

        <label for="menu-control" class="hamburger">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
        </label>

        <nav class="nav">
            <ul class="menu">
                <li><a href="/src/pages/adotar.html"><img src="/icons/adotar.png" alt="">Adotar</a></li>
                <li><a href="/src/pages/ajudar.html"><img src="/icons/ajudar.png" alt="">Ajudar</a></li>
                <li><a href="/src/pages/noticias.html"><img src="/icons/noticias.png" alt="">Notícias</a></li>
                <li><a href="/src/pages/sobre.html"><img src="/icons/sobre.png" alt="">Sobre</a></li>
                <li><a href="/src/pages/voluntario.html"><img src="/icons/voluntariado.png" alt="">Voluntariado</a></li>
            </ul>
            <div class="actions">
                <a href="#" class="login-btn">Login</a>
            </div>
        </nav>
    </header>

    <main class="voluntariado-page">
       <form id="formVoluntario" action="#" method="POST">
    <div class="form-row">
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required>
        </div>
        <div class="form-group">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" required>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" name="telefone" required>
        </div>
    </div>

    <div class="form-group schedule-group">
        <label>Agendamento de Alimentação (Opcional)</label>
        <p class="schedule-desc">Selecione os turnos para ajudar na alimentação dos animais no campus.</p>
        
        <div class="schedule-grid">
            <div class="schedule-day">
                <strong>Segunda</strong>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="seg-manha"> Manhã</label>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="seg-tarde"> Tarde</label>
            </div>
            
            <div class="schedule-day">
                <strong>Terça</strong>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="ter-manha"> Manhã</label>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="ter-tarde"> Tarde</label>
            </div>

            <div class="schedule-day">
                <strong>Quarta</strong>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="qua-manha"> Manhã</label>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="qua-tarde"> Tarde</label>
            </div>

            <div class="schedule-day">
                <strong>Quinta</strong>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="qui-manha"> Manhã</label>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="qui-tarde"> Tarde</label>
            </div>

            <div class="schedule-day">
                <strong>Sexta</strong>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="sex-manha"> Manhã</label>
                <label class="time-slot"><input type="checkbox" name="agendamento" value="sex-tarde"> Tarde</label>
            </div>
        </div>
    </div>

    <button type="submit" class="btn-submit">Enviar Inscrição</button>
</form>
        <section class="inscricao" id="inscricao">
            <div class="container">
                <h2>Formulário de Inscrição</h2>
                <p>Preencha os dados abaixo para se candidatar como voluntário</p>
                
                <form id="formVoluntario" action="#" method="POST">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nome">Nome Completo *</label>
                            <input type="text" id="nome" name="nome" required>
                        </div>
                        <button type="submit" class="btn-submit">Enviar Inscrição</button>
                    </div>

                </form>
            </div>
        </section>
    </main>
</body>

</html>
