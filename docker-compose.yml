services:
  postgres:
    image: postgres:16
    container_name: pelucia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pelucia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pelucia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pelucia"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailtrap:
    image: axllent/mailpit:latest
    container_name: pelucia-mailtrap
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pelucia_postgres_data:
